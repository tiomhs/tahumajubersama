name: Diagnosa VPS (502 Bad Gateway)

on:
  workflow_dispatch: # Jalankan manual: Actions -> "Diagnosa VPS" -> Run workflow

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Jalankan diagnosa di VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          envs: SUDO_PASS
          script: |
            set +e
            echo "=== 1. TEST SUDO ==="
            sudo -n true 2>&1 && echo "sudo: TANPA PASSWORD OK" || echo "sudo: BUTUH PASSWORD"
            echo ""
            echo "=== 2. CARI NGINX CONFIG DOMAIN ==="
            sudo grep -rln "pabriktahuklungkung" /etc/nginx/ 2>/dev/null || echo "(tidak ditemukan di /etc/nginx)"
            echo ""
            echo "=== 3. ISI CONFIG DOMAIN ==="
            for f in $(sudo grep -rln "pabriktahuklungkung" /etc/nginx/ 2>/dev/null); do echo "--- $f ---"; sudo cat "$f"; done
            echo ""
            echo "=== 4. SEMUA proxy_pass DI NGINX ==="
            sudo grep -rn "proxy_pass" /etc/nginx/ 2>/dev/null | grep -v "^\s*#" | head -20 || echo "(tidak ada)"
            echo ""
            echo "=== 5. ECOSYSTEM CONFIG DI VPS ==="
            cat /var/www/pabriktahu/ecosystem.config.cjs 2>&1
            echo ""
            echo "=== 6. PM2 LIST ==="
            pm2 list
        env:
          SUDO_PASS: ${{ secrets.PASSWORD }}
