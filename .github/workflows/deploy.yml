name: Auto Deploy ke VPS

on:
  push:
    branches:
      - main # Akan berjalan setiap kali ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Eksekusi perintah di VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            # Masuk ke folder proyek
            cd /var/www/pabriktahu

            # Tarik kode terbaru
            git pull origin main

            # Install package baru (reproducible, sesuai package-lock.json)
            npm ci

            # Build ulang Nuxt
            npm run build

            # Jalankan app lewat ecosystem (start jika belum ada, restart jika sudah jalan)
            pm2 startOrRestart ecosystem.config.cjs

            # Simpan daftar proses PM2 (agar auto-restart saat VPS reboot)
            pm2 save

            # Health check: pastikan app benar-benar melayani di port 3001
            sleep 3
            curl -s -o /dev/null -w "Health check port 3001 -> HTTP %{http_code}\n" --max-time 5 http://localhost:3001 || (echo "Health check GAGAL!" && exit 1)
