name: Auto Deploy ke VPS

on:
  push:
    branches:
      - main # Akan berjalan setiap kali ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Eksekusi perintah di VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            # Masuk ke folder proyek
            cd /var/www/pabriktahu

            # Tarik kode terbaru
            git pull origin main

            # Install package baru (reproducible, sesuai package-lock.json)
            npm ci

            # Build ulang Nuxt
            npm run build

            # Restart PM2 dan simpan daftar proses
            pm2 restart pabriktahu-landing
            pm2 save
